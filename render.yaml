services:
  - type: web
    name: gemini-tavern-proxy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_PASSWORD
        sync: false
      - key: PRO_API_KEYS
        value: ""
      - key: FREE_API_KEYS
        value: ""
      - key: KEEP_ALIVE_URL
        value: ""
